name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned to images that still ship Python 3.9 builds, so the version
        # the tool claims to support is the version CI actually runs.
        os: [ubuntu-24.04, windows-2022]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s test -v
      - name: Self audit
        run: python scripts/repo_polish.py audit . --offline --verbose
